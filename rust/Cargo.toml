[workspace]
resolver = "2"
members = ["crates/jungle-core", "crates/jungle-eval", "crates/jungle-search", "crates/jungle-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# Benchmarks and perft runs are worthless at opt-level 0, and the golden-corpus
# test walks 10k positions, so tests get real optimization too.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
